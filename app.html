<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Collection Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
    <header class="bg-white border-bottom mb-4">
        <div class="container d-flex justify-content-between py-3">
            <span class="fs-4 fw-bold text-primary"><i class="bi bi-disc-fill me-2"></i>Music Vault</span>
            <span class="text-muted">Final JS Project</span>
        </div>
    </header>

    <main class="container">
        <section class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white"><h5>Add New Album</h5></div>
            <div class="card-body">
                <form id="album-form" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Title</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Artist</label>
                        <input type="text" id="artist" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Format</label>
                        <select id="format" class="form-select">
                            <option value="CD">Physical CD</option>
                            <option value="Digital">Digital (MP3)</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Runtime (min)</label>
                        <input type="number" id="runtime" class="form-control" placeholder="e.g. 45">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Cover URL</label>
                        <input type="url" id="cover" class="form-control" placeholder="https://...">
                    </div>
                    <div class="col-md-6" id="cd-fields">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" id="isRipped">
                            <label class="form-check-label">Already Ripped to MP3?</label>
                        </div>
                    </div>
                    <div class="col-md-6 d-none" id="digital-fields">
                        <label class="form-label fw-bold">Purchase Source</label>
                        <select id="source" class="form-select">
                            <option value="Amazon">Amazon Music</option>
                            <option value="Bandcamp">Bandcamp</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary px-5">Add to Collection</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="row g-2 mb-3">
            <div class="col-md-8">
                <input type="text" id="search-bar" class="form-control" placeholder="Search by Artist or Title...">
            </div>
            <div class="col-md-4">
                <select id="filter-format" class="form-select">
                    <option value="all">All Formats</option>
                    <option value="CD">CDs Only</option>
                    <option value="Digital">Digital Only</option>
                </select>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Cover</th>
                            <th id="sort-title" style="cursor:pointer">Title <i class="bi bi-arrow-down-up small"></i></th>
                            <th>Artist</th>
                            <th>Format</th>
                            <th class="text-center">Ripped/Source</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="collection-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
