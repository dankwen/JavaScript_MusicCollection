<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">

    <!-- Nav Bar -->
    <header class="bg-white border-bottom">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-center py-1 my-2">
                <span class="align-items-center fs-4 me-md-auto text-decoration-non">Task Planner</span>
                <ul class="nav nav-pills">
                    <li class="nav-item"><a href="https://getbootstrap.com/docs/5.3/getting-started/introduction/"
                            target="_blank" class="nav-link">Bootstrap <i class="bi bi-box-arrow-up-right"></i></a></li>
                    <li class="nav-item"><a href="app.html" class="nav-link active" aria-current="page">Application</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container mt-5">


        <!-- Create Album Form -->
        <section class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5>Add New Album</h5>
            </div>
            <div class="card-body">
                <form id="album-form" class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label fw-bold">Title</label>
                        <input type="text" id="album-title" class="form-control" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold">Artist</label>
                        <input type="text" id="album-artist" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-bold">Year</label>
                        <input type="number" id="album-year" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Format</label>
                        <select id="album-format" class="form-select">
                            <option value="cd">Compact Disc</option>
                            <option value="digital">Digital (MP3)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Cover URL</label>
                        <input type="url" id="album-cover" class="form-control" placeholder="https://...">
                    </div>
                    <div id="album-source-hider" class="col-md-3 d-none">
                        <label class="form-label fw-bold">Source</label>
                        <select id="album-source" class="form-select">
                            <option value="Amazon">Amazon Music</option>
                            <option value="Bandcamp">Bandcamp</option>
                            <option value="Converted">CD Conversion</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary px-5">Add to Collection</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Filters Area -->
        <section class="row g-2 mb-3">
            <div class="col-md-8">
                <input type="text" id="filter-search" class="form-control" placeholder="Search by Artist or Title...">
            </div>
            <div class="col-md-4">
                <select id="filter-format" class="form-select">
                    <option value="all">All Formats</option>
                    <option value="cd">CDs Only</option>
                    <option value="digital">Digital Only</option>
                </select>
            </div>
        </section>

        <!-- Table Area -->
        <section class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="d-none d-sm-block">Cover</th>
                            <th id="sort-title" style="cursor:pointer">Title <i class="bi bi-arrow-down-up small"></i></th>
                            <th id="sort-artist">Artist</th>
                            <th id="sort-year">Year</th>
                            <th id="sort-source" class="text-center">Source</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="render-results">

                        <!-- Results Rendered by JS -->

                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
